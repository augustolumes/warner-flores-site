<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cards de Produtos Profissionais</title>
    <style>
        /* Reset básico e tipografia */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        body {
            background-color: #f7f5f0;
            /* Tom neutro suave combinando com o estilo floral */
            padding: 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Container dos Cards (Grade com 2 colunas lado a lado) */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            width: 100%;
            max-width: 600px;
        }

        @media (max-width: 480px) {
            .products-grid {
                gap: 12px;
            }
        }

        /* Card Moderno e Profissional */
        .product-card {
            background: #ffffff;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border: 1px solid rgba(0, 0, 0, 0.04);
        }

        /* Feedback visual ao tocar no mobile (active) */
        .product-card:active {
            transform: scale(0.98);
        }

        /* Efeito de hover para desktop */
        @media (hover: hover) {
            .product-card:hover {
                transform: translateY(-4px);
                box-shadow: 0 15px 30px rgba(0, 0, 0, 0.08);
            }
        }

        /* Container da Imagem em proporção VERTICAL (3:4) */
        .product-image-container {
            position: relative;
            width: 100%;
            aspect-ratio: 3 / 4;
            /* Proporção vertical */
            overflow: hidden;
            background-color: #eee;
        }

        .product-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .product-card:hover .product-image {
            transform: scale(1.05);
        }

        /* Conteúdo interno do card */
        .product-content {
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex-grow: 1;
            justify-content: space-between;
        }

        .product-title {
            font-size: 0.95rem;
            font-weight: 700;
            color: #1a1a1a;
        }

        .product-description {
            font-size: 0.75rem;
            color: #666;
            line-height: 1.3;
            /* Limita o texto em até 2 linhas */
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* Rodapé do Card (Preço e Botão) */
        .product-footer {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px solid #f0f0f0;
        }

        .product-price {
            font-size: 1rem;
            font-weight: 700;
            color: #111;
        }

        /* Botão sem fundo (estilo original com borda) refinado */
        .product-btn {
            width: 100%;
            background-color: transparent;
            /* Sem fundo */
            color: #1a1a1a;
            border: 1px solid #1a1a1a;
            /* Mantém a identidade com borda */
            padding: 8px;
            font-size: 0.75rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
        }

        /* Efeito suave ao passar o mouse ou tocar no botão */
        .product-btn:hover {
            background-color: #1a1a1a;
            color: #ffffff;
        }

        .product-btn:active {
            transform: scale(0.97);
        }
    </style>
</head>

<body>

    <div class="products-grid">

        <!-- CARD 1 -->
        <div class="product-card">
            <div class="product-image-container">
                <img src="https://images.unsplash.com/photo-1561181286-d3fee7d55364?auto=format&fit=crop&w=600&q=80"
                    alt="Buquê 1" class="product-image">
            </div>
            <div class="product-content">
                <div>
                    <h3 class="product-title">Buquê 1</h3>
                    <p class="product-description">Uma composição floral feita à mão para presentear em momentos
                        especiais.</p>
                </div>
                <div class="product-footer">
                    <span class="product-price">R$ 150</span>
                    <button class="product-btn">Mais detalhes</button>
                </div>
            </div>
        </div>

        <!-- CARD 2 -->
        <div class="product-card">
            <div class="product-image-container">
                <img src="https://images.unsplash.com/photo-1526047932273-341f2a7631f9?auto=format&fit=crop&w=600&q=80"
                    alt="Buquê 2" class="product-image">
            </div>
            <div class="product-content">
                <div>
                    <h3 class="product-title">Buquê 2</h3>
                    <p class="product-description">Um buquê de presença marcante, preparado com flores selecionadas.</p>
                </div>
                <div class="product-footer">
                    <span class="product-price">R$ 200</span>
                    <button class="product-btn">Mais detalhes</button>
                </div>
            </div>
        </div>

    </div>

</body>

</html>
